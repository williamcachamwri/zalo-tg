# Local Telegram Bot API Server
# Tài liệu: https://core.telegram.org/bots/api#using-a-local-bot-api-server
#
# Lợi ích:
#   - Upload file lên đến 2 GB (thay vì 50 MB)
#   - Download file lên đến 2 GB (thay vì 20 MB)
#   - Bot có thể nhận webhook qua HTTP
#
# Yêu cầu:
#   - TG_API_ID và TG_API_HASH: lấy tại https://my.telegram.org/apps
#   - (Chỉ cần cho local server — bot code không cần)
#
# Khởi động lần đầu:
#   1. docker compose up -d
#   2. Chạy script migrate nếu bot đang dùng official API:
#      curl "https://api.telegram.org/bot<TOKEN>/logOut"
#   3. Sau đó khởi động bot với TG_LOCAL_SERVER=http://localhost:8081

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID:   "${TG_API_ID}"
      TELEGRAM_API_HASH: "${TG_API_HASH}"
      # aiogram/telegram-bot-api's entrypoint intentionally ignores Docker
      # `command` arguments and builds its CLI exclusively from these vars.
      # Without TELEGRAM_LOCAL it silently starts in normal mode and rejects
      # every file:// upload from the bridge with HTTP 400.
      TELEGRAM_LOCAL:     "1"
      # getFile returns an absolute path under WORK_DIR in local mode. Keep it
      # under the host-shared /tmp tree so a bridge running either on macOS or
      # in Compose can read incoming Telegram files directly.
      TELEGRAM_WORK_DIR:  /tmp/telegram-bot-api
      TELEGRAM_TEMP_DIR:  /tmp
    volumes:
      - /tmp:/tmp
      # Explicit nested bind makes Docker create the work directory before the
      # image entrypoint tries to chown it on a fresh machine.
      - /tmp/telegram-bot-api:/tmp/telegram-bot-api
    ports:
      - "${TG_LOCAL_PORT:-8081}:8081"
    restart: unless-stopped
    healthcheck:
      # Bot API intentionally returns 404 at `/`; probe the listening socket
      # instead of treating that valid response as an unhealthy container.
      test: ["CMD", "nc", "-z", "127.0.0.1", "8081"]
      interval: 10s
      timeout: 5s
      retries: 5

  zalo-tg:
    build: .
    image: zalo-tg:latest
    container_name: zalo-tg
    restart: unless-stopped
    group_add:
      - "101"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - ZALO_TG_RUNNER=1
      - DATA_DIR=/app/data
      - ZALO_CREDENTIALS_PATH=/app/data/credentials.json
      # Inside Compose, localhost points back to this container. Route Bot API
      # traffic through the service DNS name instead.
      - TG_LOCAL_SERVER=http://telegram-bot-api:8081
    depends_on:
      telegram-bot-api:
        condition: service_healthy
    volumes:
      # Persistent data — lưu topics.json + credentials.json
      - ./data:/app/data
      # Share generated QR paths with telegram-bot-api --local.
      - /tmp:/tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
